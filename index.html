
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GameSubs - Mikrofon Testi</title>
<style>
body{background:#0b1220;color:white;font-family:Arial;padding:25px}
h1{color:#59e1d1}
button{padding:16px;border:0;border-radius:12px;margin:8px;background:#59e1d1;font-size:16px}
#result{font-size:22px;line-height:1.5;margin-top:25px}
</style>
</head>
<body>
<h1>GAME SUBS</h1>
<h2>iPhone Ses Tanıma Testi</h2>
<p>İngilizce konuşmayı Türkçe altyazı projemiz için test ediyoruz.</p>
<button id="start">🎤 Dinlemeyi başlat</button>
<button id="stop">Durdur</button>
<p id="status">Bekliyor...</p>
<div id="result">İngilizce konuşma burada görünecek.</div>
<script>
const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
const status = document.getElementById("status");
const result = document.getElementById("result");
let recognition;

if (!Speech) {
 status.textContent = "Bu Safari sürümünde ses tanıma desteklenmiyor.";
} else {
 recognition = new Speech();
 recognition.lang = "en-US";
 recognition.continuous = true;
 recognition.interimResults = true;
 recognition.onstart = () => status.textContent = "Mikrofon dinliyor...";
 recognition.onerror = e => status.textContent = "Hata: " + e.error;
 recognition.onend = () => status.textContent = "Dinleme durdu.";
 recognition.onresult = e => {
  let text = "";
  for(let i=e.resultIndex;i<e.results.length;i++){
   text += e.results[i][0].transcript + " ";
  }
  result.textContent = text;
 };
 document.getElementById("start").onclick = () => {
  try { recognition.start(); }
  catch(e) { status.textContent = "Zaten dinliyor."; }
 };
 document.getElementById("stop").onclick = () => recognition.stop();
}
</script>
</body>
</html>
